<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zombie Apocalypse Survival Test</title>
    <meta name="description" content="Take the Zombie Apocalypse Survival Test and discover how long you would survive.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- START SCREEN -->
        <section id="start-screen" class="screen">
            <div class="icon">🧟</div>

            <h1>HOW LONG WOULD YOU SURVIVE?</h1>

            <p class="subtitle">
                The outbreak has begun. Every decision matters.
                Make your choices and discover how long you would survive.
            </p>

            <div class="info">
                <span>15 Questions</span>
                <span>•</span>
                <span>4 Possible Choices</span>
            </div>

            <button id="start-btn">START SURVIVAL TEST</button>
        </section>


        <!-- QUIZ SCREEN -->
        <section id="quiz-screen" class="screen hidden">

            <div class="quiz-header">
                <span id="question-number">Question 1 of 15</span>
                <span id="score-display">Survival Test</span>
            </div>

            <div class="progress">
                <div id="progress-bar"></div>
            </div>

            <h2 id="question"></h2>

            <div id="answers"></div>

        </section>


        <!-- RESULT SCREEN -->
        <section id="result-screen" class="screen hidden">

            <div id="result-icon" class="icon">☠️</div>

            <p class="result-label">YOUR RESULT</p>

            <h1 id="result-title"></h1>

            <div class="result-score">
                <span id="final-score"></span>/60
            </div>

            <p id="result-description"></p>

            <div class="survival-box">
                <strong>Estimated Survival</strong>
                <span id="survival-time"></span>
            </div>

            <button id="restart-btn">TRY AGAIN</button>
            <button id="share-btn">📤 SHARE MY RESULT</button>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
